# User-run nginx edge in front of the web releases: HTTP/2 and HTTP/3, in place of
# Tailscale Serve for the origin. Install into ~/.local/share/kura-edge/ as nginx.conf,
# replacing HOST (the origin's host name), ADDR4 (this node's tailnet IPv4 address)
# and PORT (the origin's port). web-release.py writes upstream.conf; see web-release.md.
worker_processes 2;
pid tmp/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 1024; }
http {
  access_log logs/access.log;
  client_body_temp_path tmp/body; proxy_temp_path tmp/proxy; fastcgi_temp_path tmp/fcgi;
  uwsgi_temp_path tmp/uwsgi; scgi_temp_path tmp/scgi;
  include upstream.conf;
  server {
    listen ADDR4:PORT ssl;
    listen ADDR4:PORT quic reuseport;
    http2 on;
    http3 on;
    server_name HOST;
    # Serve binds to tailscale0; nginx cannot, so a LAN host, a VM or a container routing
    # to this address would reach it. Answer only tailnet sources: tailscaled's own
    # netfilter drops 100.64.0.0/10 sources arriving on any other interface. It does not
    # do the same for its IPv6 range, so there is no IPv6 listener (browsers fall back to
    # IPv4). A host firewall rule dropping PORT unless it arrives on tailscale0 or
    # lo is the stronger form, for whoever can install one.
    allow 100.64.0.0/10;
    deny all;
    ssl_certificate certs/host.crt;
    ssl_certificate_key certs/host.key;
    ssl_protocols TLSv1.3;
    add_header Alt-Svc 'h3=":PORT"; ma=86400' always;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    # Every path goes to the web, which holds the credential boundary for /api, /m and /data.
    location / {
      proxy_pass http://kura_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 3600s;
    }
  }
}
