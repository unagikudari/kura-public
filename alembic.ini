[alembic]
script_location = api/alembic
# DATABASE_URL env var is set by api/env via systemd EnvironmentFile
sqlalchemy.url = postgresql+asyncpg://kura:kura@localhost:5432/kura
# Use a separate version table to avoid conflict with szurubooru's alembic_version
version_table = kura_alembic_version

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
